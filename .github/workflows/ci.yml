name: ci

# Integración continua de E1: linter, pruebas y puerta de calidad de datos en cada push y pull request.
# ESTADO: PREPARADO, SIN EJECUTAR EN GITHUB. Nada de lo que hace este flujo se da por probado hasta que
# exista una ejecución real (enlace en docs/E1/ENTREGA.md). Es independiente de captura-diaria.yml, que NO
# instala las dependencias opcionales del laboratorio y no debe fallar por ellas.
on:
  push:
  pull_request:

permissions:
  contents: read   # solo lectura: este flujo no escribe en el repositorio

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      # Con esta variable las pruebas del laboratorio de pronósticos FALLAN si faltan statsmodels o scipy
      # (en vez de omitirse en silencio). Surte efecto cuando la rama e1/eimy-pronosticos esté integrada;
      # hoy no hay pruebas de pronósticos en main, así que no cambia nada todavía.
      TDL_EXIGIR_PRONOSTICOS: "1"
    defaults:
      run:
        shell: bash   # bash -e -o pipefail
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias fijadas (captura, laboratorio y desarrollo)
        run: python -m pip install -r requirements.txt -r requirements-lab.txt -r requirements-dev.txt

      - name: Linter (ruff)
        run: python -m ruff check .

      # `-rs` lista las pruebas OMITIDAS con su motivo: una omisión no cuenta como prueba ejecutada.
      - name: Pruebas
        run: python -m pytest -q -rs

      # La puerta de datos: bronce -> plata -> oro con cuarentena. Sale con código 2 si no hay salida confiable.
      - name: Puerta de calidad de datos (pipeline bronce, plata y oro)
        run: python -m pipeline.ejecutar

      - name: Verificador de E0 (histórico, integridad y privacidad)
        run: python -m pipeline.verificar_e0 --solo historico --solo integridad --solo privacidad --exigir-datos

  # Aparte para que un aviso nuevo de seguridad no bloquee todos los push; la rúbrica pide revisarlo y cerrar los hallazgos.
  auditoria-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit sobre las dependencias fijadas
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -r requirements-lab.txt --no-deps --disable-pip
