name: ci

# Integración continua de E1: linter, pruebas y puerta de calidad de datos en cada push y pull request.
# Es independiente de captura-diaria.yml, que NO instala las dependencias opcionales del laboratorio y no debe fallar por
# ellas. El historial de ejecuciones reales está en la pestaña Actions; los resultados de E1 se documentan en docs/E1/pipeline.md.
on:
  push:
  pull_request:

permissions:
  contents: read   # solo lectura: este flujo no escribe en el repositorio

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      # Con esta variable las pruebas del laboratorio (tests/test_laboratorio_*.py y tests/test_exploracion.py) FALLAN si
      # faltan statsmodels, scipy o matplotlib, en vez de omitirse en silencio. Solo este flujo las exige; la captura diaria
      # no instala esas librerías y por eso omite esas pruebas.
      TDL_EXIGIR_PRONOSTICOS: "1"
      # Igual para el tablero: sin altair y streamlit (tablero/requirements.txt) sus pruebas FALLAN en vez de omitirse en silencio.
      TDL_EXIGIR_TABLERO: "1"
    defaults:
      run:
        shell: bash   # bash -e -o pipefail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # este flujo solo lee: el token no se deja guardado en .git/config

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            tablero/requirements.txt

      # Se instalan juntas (una sola resolución de pip) para que un conflicto entre el tablero y el resto falle aquí.
      - name: Instalar dependencias fijadas (captura, laboratorio, desarrollo y tablero)
        run: python -m pip install -r requirements.txt -r requirements-lab.txt -r requirements-dev.txt -r tablero/requirements.txt

      - name: Linter (ruff)
        run: python -m ruff check .

      # `-rs` lista las pruebas OMITIDAS con su motivo: una omisión no cuenta como prueba ejecutada. La cobertura se mide sobre el
      # código del proyecto y el piso (75 %) evita que baje sin que nadie lo note; medida al 2026-11-14: 84 % (3,429 líneas).
      - name: Pruebas con cobertura
        run: python -m pytest -q -rs --cov=pipeline --cov=extractores --cov=laboratorio --cov=tablero --cov-report=term --cov-fail-under=75

      # La puerta de datos: bronce -> plata -> oro con cuarentena. Sale con código 2 si no hay salida confiable.
      - name: Puerta de calidad de datos (pipeline bronce, plata y oro)
        run: python -m pipeline.ejecutar

      # Tras regenerar el oro, debe coincidir con el versionado (git show HEAD:...). Se excluyen los campos de hora de los
      # .meta.json y la oferta DENUE, que cambia con cada captura diaria (detalle en pipeline/verificar_oro.py).
      - name: El oro regenerado coincide con el oro versionado
        run: python -m pipeline.verificar_oro

      - name: Verificador de E0 (histórico, integridad y privacidad)
        run: python -m pipeline.verificar_e0 --solo historico --solo integridad --solo privacidad --exigir-datos

  # Aparte para que un aviso nuevo de seguridad no bloquee todos los push; la rúbrica pide revisarlo y cerrar los hallazgos.
  auditoria-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # este flujo solo lee: el token no se deja guardado en .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: pip-audit sobre las dependencias fijadas (captura, laboratorio y desarrollo)
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -r requirements-lab.txt -r requirements-dev.txt --no-deps --disable-pip
      # El archivo de bloqueo fija el cierre transitivo EXACTO del tablero (34 paquetes) con el SHA-256 de cada archivo: se audita
      # exactamente eso, sin depender de lo que resuelva pip ese día.
      - name: pip-audit del bloqueo del tablero (cierre transitivo exacto, con hashes)
        run: python -m pip_audit -r tablero/requirements.lock.txt --require-hashes --disable-pip
      # Streamlit Community Cloud lee tablero/requirements.txt (4 directas) y resuelve el resto al desplegar: aquí SÍ se resuelven
      # (sin --no-deps) para auditar también lo que podría instalarse hoy. Límite: lo que resuelve pip HOY puede cambiar mañana.
      - name: pip-audit de tablero/requirements.txt, con dependencias transitivas resueltas
        run: python -m pip_audit -r tablero/requirements.txt

  # Comprueba que el archivo de bloqueo se instala de verdad con hashes obligatorios (un hash mal copiado o un paquete que ya no
  # coincide hace fallar la instalación) y que el entorno resultante no tiene conflictos.
  bloqueo-tablero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # este flujo solo lee: el token no se deja guardado en .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Instalar el tablero desde el bloqueo (--require-hashes)
        run: |
          python -m venv "$RUNNER_TEMP/entorno-bloqueo"
          "$RUNNER_TEMP/entorno-bloqueo/bin/python" -m pip install --require-hashes -r tablero/requirements.lock.txt
          "$RUNNER_TEMP/entorno-bloqueo/bin/python" -m pip check
      - name: Importar el tablero con ese entorno
        run: |
          "$RUNNER_TEMP/entorno-bloqueo/bin/python" -c "import altair, numpy, pandas, streamlit; print(streamlit.__version__, altair.__version__, pandas.__version__, numpy.__version__)"

  # Búsqueda automática de secretos en TODO el historial (no solo en lo que se sube). El binario se fija por versión y se verifica
  # con su SHA-256 (de gitleaks_8.30.1_checksums.txt de la release oficial); sin acciones de terceros. Solo lectura.
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # este flujo solo lee: el token no se deja guardado en .git/config
          fetch-depth: 0   # historial completo; con el valor por defecto (1) no se revisaría el pasado
      - name: Instalar gitleaks 8.30.1 (binario fijado y verificado)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks version
      # --redact: ningún valor aparece en el registro. Sale con código 1 si hay hallazgos y el trabajo falla.
      - name: Buscar secretos en el historial
        run: ./gitleaks git . --log-opts="--all" --redact --no-banner --exit-code 1
